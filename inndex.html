<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Survey Form</title>
  </head>

  <body>
    <h1 id="title">Survey-Form</h1>
    <p id="description">Please fill out this survey to help us improve our services</p>
    <form id="survey-form">
      <label id="name-label" for="name">Name:</label>
      <input type="text" id="name" placeholder="Enter your name please" required>
      <label id="email-label" for="email">Email:</label>
      <input type="email" id="email" placeholder="Enter your email" required>

      <label id="number-label" for="number">Age(optional):</label>
      <input type="number" id="number" min="1" max="120" placeholder="Enter your age">

      <label for="dropdown">which option best decribes you?</label>
      <select id="dropdown">
        <option value="">select an option</option>
        <option value="student">Student</option>
        <option value="professional">Professional</option>
        <option value="other">Other</option> 
        </select>
      <fieldset>
        <legend>Would you recommend our service?</legend>
        <label>
          <input type="radio" name="recommend" value="definitely">Definitely
         </label>
          <label>
            <input type="radio" name="recommend" value="maybe">Maybe
            </label>
      </fieldset>
      <fieldset>
        <legend>what would you like to see improved?<legend>
        <label>
          <input type="checkbox" value="frontend">Front-end Projects
          </label>
        <label>
          <input type="checkbox" value="backend">Back-end projects
          </label>
          <label>
            <input type="checkbox" value="data">Data Visualization
            </label>
      </fieldset>
      <label for="comments">Any additional comments?</label>
      <textarea id="comments" placeholder="Enter your comments here..."></textarea>

      <button type="submit" id="submit">Submit</button>
      </form>


    </body>
</html>
